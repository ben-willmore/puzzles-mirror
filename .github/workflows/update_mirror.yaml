name: Update mirror
on:
  workflow_dispatch:
  schedule:
    - cron: "05 03 * * *"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror
      - name: Update mirror
        id: update
        run: |
          git remote add upstream https://git.tartarus.org/simon/puzzles.git
          rev1=`git rev-parse HEAD`
          git pull upstream main
          rev2=`git rev-parse HEAD`
          if [[ $rev1 != $rev2 ]]; then
            echo Upstream updated
            git push origin
            echo "BUILD=true" >> "$GITHUB_OUTPUT"
          else
            echo No upstream update
          fi

      - name: Build
        if: steps.update.outputs.BUILD == 'true'
        run: |
          echo ${{ steps.update.outputs.BUILD }}
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install halibut
          mkdir build-mac
          cd build-mac
          cmake ..
          make -j4
          zip -r Puzzles.app.zip Puzzles.app

      - name: Create release
        uses: "marvinpinto/action-automatic-releases@latest"
        if: steps.update.outputs.BUILD == 'true'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "Puzzles-mac-latest"
          prerelease: true
          title: "Puzzles Mac (Apple Silicon)"
          files: |
            build-mac/Puzzles.app.zip
